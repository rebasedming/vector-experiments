[package]
name = "vector-experiments"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
arrow = { version = "54", default-features = false }
clap = { version = "4", features = ["derive"] }
matrixmultiply = "0.3"
parquet = { version = "54", default-features = false, features = ["arrow", "snap", "zstd"] }
rand = "0.8"
rand_distr = "0.4"
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
accelerate-src = "0.3"

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
# BLIS is linked via build.rs (`cargo:rustc-link-lib=blis-pthread`).
# We use BLIS over OpenBLAS on Linux/aarch64 because BLIS scales much
# better across Neoverse-V2 cores: at 4 threads we measure ~218 GFLOPS
# vs OpenBLAS's ~155 (OpenBLAS auto-picks neoversev1 kernels and tops
# out at 1.8× single-core scaling on Graviton4). Single-thread the
# numbers are reversed (OpenBLAS 86 GFLOPS, BLIS 66) but our workloads
# are always multi-threaded.
# Required system package: libblis-pthread-dev

[[example]]
name = "sgemm_bench"
path = "examples/sgemm_bench.rs"
